online_coverage_node:
  ros__parameters:
    use_sim_time: true
    enabled_on_startup: false

    map_topic: /map
    global_frame: map
    robot_base_frame: base_footprint
    navigate_to_pose_action: /navigate_to_pose

    # Largeur réellement couverte par un passage du robot.
    coverage_width: 0.30
    overlap_ratio: 0.15

    # Rayon physique du robot et marge supplémentaire autour des obstacles.
    robot_radius: 0.18
    safety_margin: 0.05

    free_threshold: 20
    occupied_threshold: 65
    goal_tolerance: 0.12
    minimum_goal_distance: 0.20
    failed_goal_exclusion_radius: 0.35
    pose_record_distance: 0.025
    planning_period: 1.0
    transform_timeout: 0.20
    completion_stable_cycles: 8
    return_to_initial_pose: true
